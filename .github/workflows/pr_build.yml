name: pr build

on:
  push:
    branches: [master, main]
  pull_request: 
    branches: [ main, master ] 
    paths-ignore:
       - '**.md'
       - 'assets/**'
       - 'package.json'
  
  workflow_dispatch:

concurrency:
   group: ${{github.workflow}}-${{ github.head_ref || github.ref }}
   cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: "pr build check for bad code and unsued imports"
    runs-on: ubuntu-latest
  # this is used to disable reports to vercel
  env:
      NEXT_TELEMETRY_DISABLED: "1"
  
  steps:
     - uses: actions/checkout@v7
      
     - name: Setup Node.js
       uses: actions/setup-node@v7
       with:
          node-version: 24.x
          cache: 'npm'

     - run: npm ci

     - run: npm run lint

     - run: npm run build

     - name: upload build generated
       if: success()
       uses: actions/upload-artifact@v7
       with:
          name: build-output
          path: next
          retention-days: 10

status-check:
    name: Pr Build status
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
           if [ "${{ needs.verify.result }}" != "success" ]; then
              echo "build failed"
              exit 1
           fi
              echo "Pr checks passed"




